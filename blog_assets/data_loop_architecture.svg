<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">

  <!-- ============================================ -->
  <!-- LOGO PLACEMENT GUIDE                          -->
  <!-- ============================================ -->
  <!-- This SVG has 3 logo placeholder slots:        -->
  <!--   logo-strands  (the agent, top)              -->
  <!--   logo-lerobot  (dataset format, center)      -->
  <!--   logo-huggingface (bucket backend, center)   -->
  <!-- To insert a real logo:                        -->
  <!--   1. Find the <g> with the matching id        -->
  <!--   2. Delete the <rect> and <text> inside      -->
  <!--   3. Replace with <image href="LOGO_URL"      -->
  <!--      x=".." y=".." width=".." height=".."      -->
  <!--      preserveAspectRatio="xMidYMid meet"/>     -->
  <!-- ============================================ -->

  <defs>
    <style>
      .box-fill { fill: #FFFFFF; }
      .box-stroke { stroke: #1A3B5C; stroke-width: 1.5; }
      .accent-stroke { stroke: #FF6B35; stroke-width: 2; }
      .collect-fill { fill: #FFF4E8; }   /* warm: collection */
      .aggregate-fill { fill: #F0E8F5; } /* violet: dedup */
      .train-fill { fill: #E8F1F8; }     /* blue: train */
      .deploy-fill { fill: #E8F5EC; }    /* green: hardware */
      .bucket-fill { fill: #FFF9E8; }
      .title-text { font-size: 15px; font-weight: 700; fill: #1A3B5C; }
      .phase-text { font-size: 13px; font-weight: 600; fill: #1A3B5C; }
      .body-text { font-size: 11px; fill: #333; }
      .mono-text { font-size: 10.5px; fill: #1A3B5C; font-family: 'SF Mono', Menlo, Consolas, monospace; font-weight: 600; }
      .label-text { font-size: 10px; fill: #555; font-style: italic; }
      .logo-placeholder { fill: #FAFAFA; stroke: #BBB; stroke-width: 1; stroke-dasharray: 3,2; }
      .logo-placeholder-text { font-size: 9px; fill: #888; font-style: italic; }
      .flow-line { stroke: #FF6B35; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .loop-line { stroke: #1A3B5C; stroke-width: 2; fill: none; stroke-dasharray: 6,4; marker-end: url(#arrow-blue); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#FF6B35"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1A3B5C"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="34" text-anchor="middle" class="title-text">The physical-AI data loop — one backend, four phases</text>
  <text x="500" y="52" text-anchor="middle" class="label-text">Strands Agents · LeRobot format · Hugging Face Storage Buckets</text>

  <!-- ============ AGENT (top) ============ -->
  <rect x="360" y="72" width="280" height="58" rx="8" class="box-fill box-stroke collect-fill"/>
  <!-- logo-strands: x=375 y=84 width=34 height=34 -->
  <g class="logo-slot" id="logo-strands">
    <rect x="375" y="84" width="34" height="34" rx="4" class="logo-placeholder"/>
    <text x="392" y="104" text-anchor="middle" class="logo-placeholder-text">Strands</text>
  </g>
  <text x="422" y="98" class="phase-text">Strands Agent</text>
  <text x="422" y="116" class="body-text">Robot("so100") as an AgentTool — one NL prompt</text>

  <!-- agent down to collect -->
  <path class="flow-line" d="M 500 130 L 500 158"/>

  <!-- ============ PHASE 1: COLLECT ============ -->
  <rect x="60" y="160" width="400" height="120" rx="8" class="box-fill box-stroke collect-fill"/>
  <text x="80" y="184" class="phase-text">1 · Collect into a mutable bucket</text>
  <text x="80" y="206" class="body-text">Record a LeRobotDataset in sim or on hardware:</text>
  <text x="80" y="226" class="body-text">parquet (state/action) + per-camera MP4 + meta/.</text>
  <rect x="80" y="236" width="360" height="32" rx="4" class="bucket-fill box-stroke"/>
  <text x="92" y="256" class="mono-text">sim.stop_recording(bucket="my-org/robot-fave")</text>

  <!-- ============ PHASE 2: AGGREGATE ============ -->
  <rect x="540" y="160" width="400" height="120" rx="8" class="box-fill box-stroke aggregate-fill"/>
  <text x="560" y="184" class="phase-text">2 · Aggregate &amp; deduplicate</text>
  <text x="560" y="206" class="body-text">Xet content-defined chunking, byte-level dedup.</text>
  <text x="560" y="226" class="body-text">A daily re-sync uploads only the changed shards</text>
  <text x="560" y="244" class="body-text">(~100 MB each) — about 4× less per upload.</text>
  <text x="560" y="266" class="label-text">hf://buckets/... · mutable · overwrite-in-place</text>

  <!-- collect -> aggregate -->
  <path class="flow-line" d="M 460 220 L 536 220"/>

  <!-- ============ PHASE 3: TRAIN ============ -->
  <rect x="540" y="320" width="400" height="120" rx="8" class="box-fill box-stroke train-fill"/>
  <text x="560" y="344" class="phase-text">3 · Train at scale by streaming</text>
  <text x="560" y="366" class="body-text">Byte-range reads over shards feed the GPUs —</text>
  <text x="560" y="384" class="body-text">video decodes on the fly, nothing on local disk.</text>
  <rect x="560" y="396" width="360" height="32" rx="4" class="train-fill box-stroke"/>
  <text x="572" y="416" class="mono-text">reader = sim.stream_dataset("my-org/robot-fave")</text>

  <!-- aggregate -> train -->
  <path class="flow-line" d="M 740 280 L 740 316"/>

  <!-- ============ PHASE 4: DEPLOY ============ -->
  <rect x="60" y="320" width="400" height="120" rx="8" class="box-fill box-stroke deploy-fill"/>
  <text x="80" y="344" class="phase-text">4 · Deploy &amp; iterate</text>
  <text x="80" y="366" class="body-text">Push the checkpoint to the physical robot.</text>
  <text x="80" y="384" class="body-text">Included egress (up to 8:1) keeps the fleet</text>
  <text x="80" y="402" class="body-text">shipping fresh policies — one keyword change:</text>
  <rect x="80" y="410" width="360" height="0" />
  <text x="80" y="424" class="mono-text">Robot("so100", mode="real")</text>

  <!-- train -> deploy -->
  <path class="flow-line" d="M 536 380 L 464 380"/>

  <!-- deploy -> collect (close the loop) : up the left side -->
  <path class="loop-line" d="M 80 320 C 30 300, 30 240, 60 222"/>
  <text x="18" y="285" class="label-text" transform="rotate(-90 18 285)">new demos flow back</text>

  <!-- ============ CENTER: shared backend ============ -->
  <rect x="410" y="300" width="180" height="60" rx="8" class="box-fill accent-stroke" fill="#FFFFFF"/>
  <text x="500" y="322" text-anchor="middle" class="phase-text">One backend</text>
  <!-- logo-lerobot + logo-huggingface side by side -->
  <g class="logo-slot" id="logo-lerobot">
    <rect x="424" y="330" width="68" height="22" rx="3" class="logo-placeholder"/>
    <text x="458" y="345" text-anchor="middle" class="logo-placeholder-text">LeRobot</text>
  </g>
  <g class="logo-slot" id="logo-huggingface">
    <rect x="508" y="330" width="68" height="22" rx="3" class="logo-placeholder"/>
    <text x="542" y="345" text-anchor="middle" class="logo-placeholder-text">HF Buckets</text>
  </g>

  <!-- footer caption -->
  <text x="500" y="470" text-anchor="middle" class="body-text">The dataset never leaves the LeRobot format. The agent loop — and the bucket — are the glue.</text>
  <text x="500" y="492" text-anchor="middle" class="label-text">No IAM roles, no upload service, no cloud infrastructure to run.</text>

</svg>

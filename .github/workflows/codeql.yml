name: CodeQL

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    # Weekly scan on Monday 06:00 UTC catches drift even when no PRs land.
    # This is the single source of truth for both PR/push and scheduled scans
    # (codeql-advanced.yml was removed in #237 to drop the duplicate Python scan).
    - cron: '0 6 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
      packages: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: actions
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@4e828ff8d448a8a6e532957b1811f387a63867e8  # v3.29.4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Shared config carries the documented py/unsafe-cyclic-import
          # suppression for the simulation triple. See .github/codeql/README.md.
          config-file: ./.github/codeql/config.yml
          # security-and-quality covers taint flows (LLM input -> subprocess /
          # XML / paths) plus broader quality lints. Catches the bug class
          # surfaced in PR #85 (MJCF interpolation) and PR #90 (subprocess
          # injection / path traversal).
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@4e828ff8d448a8a6e532957b1811f387a63867e8  # v3.29.4
        with:
          category: "/language:${{ matrix.language }}"
          # Findings appear in the Security tab; PRs are not blocked on
          # CodeQL alerts (false-positive rate makes hard-fail noisy).

  suppression-narrowness:
    # Asserts the py/unsafe-cyclic-import suppression in
    # .github/codeql/config.yml stays narrow: with the exclude dropped, the
    # ONLY files that fire the rule must be the simulation triple. If a new
    # file starts firing, this job goes red (see .github/codeql/README.md).
    name: CodeQL suppression narrowness
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    permissions:
      contents: read
      security-events: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: '3.12'

      - name: Install CodeQL CLI
        run: |
          set -euo pipefail
          # The CLI binaries are published as .zip (there is no .tar.gz asset);
          # the SHA-256 is pinned so a swapped/corrupt download fails loudly
          # rather than silently feeding a 404 body into the unpack step.
          CODEQL_VERSION="v2.19.3"
          CODEQL_SHA256="87b44267a0e5c8bd1771672705fef26d7226bb64a200cf56f119c697f14ccccc"
          curl --fail -sSL -o codeql.zip \
            "https://github.com/github/codeql-cli-binaries/releases/download/${CODEQL_VERSION}/codeql-linux64.zip"
          echo "${CODEQL_SHA256}  codeql.zip" | sha256sum --check --strict
          unzip -q codeql.zip
          echo "${PWD}/codeql" >> "${GITHUB_PATH}"

      - name: Analyze with suppression dropped
        run: |
          set -euo pipefail
          codeql database create db --language=python --source-root=. --overwrite
          codeql database analyze db \
            codeql/python-queries:Imports/UnsafeCyclicImport.ql \
            --format=sarif-latest --output=cyclic-import.sarif --threads=0

      - name: Assert violating file set is exactly the simulation triple
        run: python .github/codeql/check_suppression_narrowness.py cyclic-import.sarif

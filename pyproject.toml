[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strands-robots"
version = "1.0.0.dev0"
description = "A Simulation is a world, a Robot is a body in a world (or on a bus), a Policy turns an observation into an action."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "robot_descriptions>=1.12",
]

[project.optional-dependencies]
mujoco = ["mujoco>=3.3.4"]
dev = ["pytest>=8", "pytest-timeout", "ruff>=0.6", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["strands_robots"]

[tool.hatch.envs.default]
features = ["dev", "mujoco"]

[tool.hatch.envs.default.scripts]
lint = [
    "ruff check strands_robots tests",
    "ruff format --check strands_robots tests",
    "mypy strands_robots",
]
format = ["ruff check --fix strands_robots tests", "ruff format strands_robots tests"]
test = "pytest {args}"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
markers = ["network: talks to the internet (GitHub / Hugging Face); deselect with -m 'not network'"]

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Strands Robots — Mesh Dashboard</title>
<style>
  :root {
    --bg: #0b0e14; --panel: #131820; --panel2: #1a212c; --line: #232c3a;
    --txt: #d6deeb; --dim: #7a8699; --accent: #36d399; --warn: #fbbd23;
    --err: #f87272; --blue: #3b82f6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--txt);
    font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  header {
    display: flex; align-items: center; gap: 16px; padding: 12px 18px;
    background: var(--panel); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .5px; }
  .status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dim); }
  .dot.live { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .dot.dead { background: var(--err); }
  .spacer { flex: 1; }
  button {
    background: var(--panel2); color: var(--txt); border: 1px solid var(--line);
    padding: 7px 14px; border-radius: 6px; cursor: pointer; font: inherit;
  }
  button:hover { border-color: var(--accent); }
  button.estop {
    background: #2a1316; color: var(--err); border-color: #5c2329; font-weight: 700;
  }
  button.estop:hover { background: var(--err); color: #fff; }
  main { display: grid; grid-template-columns: 320px 1fr 360px; gap: 1px; background: var(--line);
         height: calc(100vh - 50px); }
  .col { background: var(--bg); overflow-y: auto; padding: 14px; }
  .col h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--dim); margin: 0 0 12px; font-weight: 600;
  }
  .peer {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; margin-bottom: 10px; cursor: pointer; transition: border-color .15s;
  }
  .peer:hover { border-color: var(--blue); }
  .peer.sel { border-color: var(--accent); }
  .peer .row { display: flex; align-items: center; gap: 8px; }
  .peer .name { font-weight: 600; }
  .peer .type {
    font-size: 10px; text-transform: uppercase; padding: 2px 6px; border-radius: 4px;
    background: var(--panel2); color: var(--dim);
  }
  .peer .type.sim { color: var(--blue); }
  .peer .type.robot { color: var(--accent); }
  .peer .type.dashboard { color: var(--warn); }
  .peer .meta { font-size: 11px; color: var(--dim); margin-top: 4px; }
  .peer .age { margin-left: auto; font-size: 11px; color: var(--dim); }
  .joints { margin-top: 8px; }
  .joint { margin: 5px 0; }
  .joint .jl { display: flex; justify-content: space-between; font-size: 11px; color: var(--dim); }
  .bar { height: 6px; background: var(--panel2); border-radius: 3px; overflow: hidden; margin-top: 2px; }
  .bar > div { height: 100%; background: var(--accent); width: 50%; transition: width .1s linear; }
  .event { font-size: 12px; padding: 5px 8px; border-left: 2px solid var(--line); margin-bottom: 4px; }
  .event .t { color: var(--dim); }
  .event.peer_join { border-left-color: var(--accent); }
  .event.cmd { border-left-color: var(--blue); }
  .event.err { border-left-color: var(--err); color: var(--err); }
  .detail { color: var(--dim); font-size: 12px; }
  .kv { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid var(--line); }
  .kv span:first-child { color: var(--dim); }
  .empty { color: var(--dim); font-style: italic; padding: 20px 0; text-align: center; }
  .cmdbar { display: flex; gap: 6px; margin-top: 10px; }
  .view3d-wrap { margin-top: 4px; }
  #view3d { width: 100%; height: 320px; background: #0b0e14; border: 1px solid var(--line);
            border-radius: 8px; overflow: hidden; }
  #view3d canvas { display: block; cursor: grab; }
  #view3d canvas:active { cursor: grabbing; }
  .camgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap: 8px; }
  .cam { background: #000; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .cam img { width: 100%; display: block; image-rendering: auto; }
  .caml { font-size: 10px; color: var(--dim); padding: 3px 6px; }
  .tbtn { font-size: 11px; padding: 2px 8px; margin-left: 8px; }
  .tbtn.on { background: var(--accent); color: #000; border-color: var(--accent); }
  .thint { font-size: 10px; color: var(--dim); margin-left: 8px; }
  .tj { margin: 6px 0; }
  .tjl { display: flex; justify-content: space-between; font-size: 11px; color: var(--dim); }
  .tjk { color: var(--warn); font-size: 10px; }
  .tj input[type=range] { width: 100%; accent-color: var(--accent); }
  .cmdbar input {
    flex: 1; background: var(--panel2); border: 1px solid var(--line); color: var(--txt);
    border-radius: 6px; padding: 7px 10px; font: inherit;
  }
</style>
</head>
<body>
<header>
  <h1>STRANDS&nbsp;ROBOTS</h1>
  <div class="status"><span id="dot" class="dot"></span><span id="statusText">connecting…</span></div>
  <div class="status">peer: <span id="selfId">—</span></div>
  <div class="spacer"></div>
  <div class="status"><span id="peerCount">0</span> peers</div>
  <button class="estop" onclick="estop()">⬛ E-STOP ALL</button>
</header>
<main>
  <div class="col" id="peersCol">
    <h2>Peers</h2>
    <div id="peers"></div>
  </div>
  <div class="col" id="detailCol">
    <h2>Detail</h2>
    <div id="detail"><div class="empty">Select a peer to inspect.</div></div>
  </div>
  <div class="col" id="eventsCol">
    <h2>Event Log</h2>
    <div id="events"></div>
  </div>
</main>

<script type="module">
import { Viewer3D, decodeGeometry } from "./static/viewer3d.js";

const peers = {};      // peer_id -> presence dict
const states = {};     // peer_id -> last state dict
const cameras = {};    // peer_id -> {cam_name: {data, t}}
let viewer3d = null;       // Viewer3D instance for the selected peer
let viewer3dPeer = null;   // which peer the viewer currently shows
const sceneGeom = {};      // peer_id -> decoded geometry (cached)
let pendingGeomDecode = {}; // peer_id -> bool (decode in flight)
let selected = null;
let ws = null;
let reqSeq = 0;

function now() { return Date.now() / 1000; }
function fmtAge(ts) {
  if (!ts) return "?";
  const a = now() - ts;
  if (a < 1) return "now";
  if (a < 60) return a.toFixed(0) + "s";
  return (a / 60).toFixed(0) + "m";
}

function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onopen = () => setStatus(true, "connected");
  ws.onclose = () => { setStatus(false, "disconnected — retrying"); setTimeout(connect, 1500); };
  ws.onerror = () => setStatus(false, "error");
  ws.onmessage = (e) => handle(JSON.parse(e.data));
}

function setStatus(live, text) {
  const dot = document.getElementById("dot");
  dot.className = "dot " + (live ? "live" : "dead");
  document.getElementById("statusText").textContent = text;
}

function handle(msg) {
  const { type, data } = msg;
  if (type === "hello") {
    document.getElementById("selfId").textContent = data.peer_id || "—";
    setStatus(data.mesh_alive, data.mesh_alive ? "mesh live" : "mesh down");
    (data.peers || []).forEach(ingestPeer);
    renderPeers();
  } else if (type === "peers") {
    const seen = new Set();
    (data.peers || []).forEach(p => { ingestPeer(p); seen.add(p.peer_id || p.robot_id); });
    for (const id of Object.keys(peers)) if (!seen.has(id)) { delete peers[id]; delete states[id]; }
    renderPeers();
    if (selected && !document.getElementById('kv')) buildDetailChrome();
    if (selected) { patchDetail(); renderCameras(); }
  } else if (type === "state") {
    const id = data.peer_id; if (!id) return;
    states[id] = data;
    if (id === selected) patchDetail();
  } else if (type === "presence") {
    ingestPeer(data); renderPeers();
  } else if (type === "event") {
    addEvent(data._topic || "event", JSON.stringify(data).slice(0, 120));
  } else if (type === "scene_geom") {
    handleSceneGeom(data);
  } else if (type === "scene_pose") {
    if (viewer3d && data.peer_id === viewer3dPeer) viewer3d.setPose(data);
  } else if (type === "camera") {
    const id = data.peer_id; if (!id) return;
    cameras[id] = cameras[id] || {};
    cameras[id][data.cam] = { data: data.data, encoding: data.encoding, t: data.t };
    if (id === selected) renderCameras();
  } else if (type === "stream") {
    if (data.peer_id === selected) patchDetail();
  } else if (type === "ack") {
    addEvent("ack:" + msg.action, JSON.stringify(data).slice(0, 160), "cmd");
  }
}

function ingestPeer(p) {
  const id = p.peer_id || p.robot_id; if (!id) return;
  peers[id] = { ...(peers[id] || {}), ...p, peer_id: id, last_seen: p.last_seen || now() };
}

function renderPeers() {
  const ids = Object.keys(peers).sort();
  document.getElementById("peerCount").textContent = ids.length;
  const el = document.getElementById("peers");
  if (!ids.length) { el.innerHTML = '<div class="empty">No peers on the mesh yet.</div>'; return; }
  el.innerHTML = ids.map(id => {
    const p = peers[id];
    const t = (p.type || p.peer_type || p.robot_type || "robot").toLowerCase();
    return `<div class="peer ${id === selected ? "sel" : ""}" onclick="select('${id}')">
      <div class="row"><span class="name">${id}</span>
        <span class="type ${t}">${t}</span>
        <span class="age">${fmtAge(p.last_seen)}</span></div>
      <div class="meta">${p.hostname || ""} ${p.instruction ? "· " + p.instruction : ""}</div>
    </div>`;
  }).join("");
}

function select(id) {
  selected = id;
  teleopStop();                 // leave teleop when switching peers
  renderPeers();
  buildDetailChrome();
  patchDetail();
  renderCameras();
  setupViewer3D();
}

// Create (or recreate) the 3D viewer for the selected peer. If we already
// have cached geometry for it, build immediately; otherwise the next
// scene_geom message will populate it.
function setupViewer3D() {
  const host = document.getElementById("view3d");
  if (!host) return;
  if (viewer3d) { viewer3d.dispose(); viewer3d = null; }

  // The selected peer drives the 3D view if it has geometry of its own
  // (a sim). A real robot has no geometry, so we fall back to a "twin":
  // any sim peer currently mirroring it. The pose stream is keyed by the
  // peer that owns the geometry, so viewer3dPeer must be that geometry
  // owner -- not necessarily the selected peer.
  let geomPeer = sceneGeom[selected] ? selected : null;
  if (!geomPeer) {
    // Fallback: first peer that has geometry (the twin). With a single
    // sim-twin on the mesh this "just works"; multi-twin disambiguation
    // can come later via an explicit link.
    geomPeer = Object.keys(sceneGeom)[0] || null;
  }

  viewer3dPeer = geomPeer;
  viewer3d = new Viewer3D(host);
  if (geomPeer && sceneGeom[geomPeer]) {
    viewer3d.setGeometry(sceneGeom[geomPeer]);
    const twinNote = geomPeer === selected ? "" : ` (twin: ${geomPeer})`;
    setView3dHint(twinNote);
  } else {
    setView3dHint("(waiting for sim geometry…)");
  }
}

function setView3dHint(txt) {
  const h = document.getElementById("view3dHint");
  if (h) h.textContent = txt;
}

// A scene_geom message arrived (gzip+b64). Decode once, cache, and if it is
// for the currently-viewed peer, push it into the live viewer.
async function handleSceneGeom(data) {
  const id = data.peer_id;
  if (!id) return;
  if (sceneGeom[id] || pendingGeomDecode[id]) {
    // Already have it (geometry is static + periodically re-sent). Ignore.
    if (sceneGeom[id] && viewer3d && id === viewer3dPeer && !viewer3d.ready) {
      viewer3d.setGeometry(sceneGeom[id]); setView3dHint("");
    }
    return;
  }
  pendingGeomDecode[id] = true;
  try {
    const geo = await decodeGeometry(data);
    sceneGeom[id] = geo;
    addEvent("scene", `geometry for ${id}: ${geo.meshes.length} meshes, ${geo.ngeom} geoms`);
    if (viewer3d && id === viewer3dPeer) { viewer3d.setGeometry(geo); setView3dHint(""); }
  } catch (e) {
    addEvent("err", "geometry decode failed: " + e, "err");
  } finally {
    pendingGeomDecode[id] = false;
  }
}

// Build the static skeleton once per selection. Live data (joints, kv,
// cameras) is patched in place by patchDetail()/renderCameras() so a 10Hz
// state stream never blows away a half-typed command or flickers the video.
function buildDetailChrome() {
  const el = document.getElementById("detail");
  if (!selected || !peers[selected]) {
    el.innerHTML = '<div class="empty">Select a peer.</div>';
    return;
  }
  el.innerHTML = `
    <div id="kv"></div>
    <div class="view3d-wrap"><h2 style="margin-top:14px">3D View <span class="thint" id="view3dHint">(waiting for sim geometry…)</span></h2>
      <div id="view3d"></div></div>
    <div id="joints"></div>
    <div id="cams"></div>
    <div class="teleop" id="teleop">
      <h2 style="margin-top:14px">Teleop
        <button id="teleopBtn" class="tbtn" onclick="teleopToggle()">enable</button>
        <span id="teleopHint" class="thint"></span>
      </h2>
      <div id="teleopJoints"></div>
    </div>
    <div class="cmdbar">
      <input id="cmdInput" placeholder="tell ${selected}…" onkeydown="if(event.key==='Enter')tellPeer()"/>
      <button onclick="tellPeer()">Send</button>
    </div>
    <div class="cmdbar">
      <button onclick="sendAction('status')">status</button>
      <button onclick="sendAction('stop')">stop</button>
      <button onclick="sendAction('reset')">reset</button>
      <button onclick="sendAction('state')">state</button>
    </div>`;
}

function patchDetail() {
  if (!selected || !peers[selected]) return;
  const p = peers[selected], s = states[selected] || {};
  const kv = document.getElementById("kv");
  if (kv) {
    let h = `<div class="kv"><span>peer_id</span><span>${selected}</span></div>`;
    h += `<div class="kv"><span>type</span><span>${p.type || p.peer_type || p.robot_type || "?"}</span></div>`;
    h += `<div class="kv"><span>host</span><span>${p.hostname || "?"}</span></div>`;
    if (p.task_status) h += `<div class="kv"><span>task</span><span>${p.task_status}</span></div>`;
    if (s.sim_time != null) h += `<div class="kv"><span>sim_time</span><span>${(+s.sim_time).toFixed(2)}s</span></div>`;
    kv.innerHTML = h;
  }
  patchJoints(s.joints || {});
}

function jointVal(v) {
  if (Array.isArray(v)) return v.length ? +v[0] : 0;
  return typeof v === "number" ? v : 0;
}

function patchJoints(joints) {
  const el = document.getElementById("joints");
  if (!el) return;
  const jk = Object.keys(joints);
  if (!jk.length) { el.innerHTML = ""; return; }
  // Build rows once; thereafter only update widths/labels by id.
  if (el.dataset.keys !== jk.join(",")) {
    el.dataset.keys = jk.join(",");
    let h = `<h2 style="margin-top:14px">Joints</h2>`;
    for (const k of jk) {
      h += `<div class="joint"><div class="jl"><span>${k}</span><span id="jv-${cssId(k)}">0</span></div>
        <div class="bar"><div id="jb-${cssId(k)}"></div></div></div>`;
    }
    el.innerHTML = h;
  }
  for (const k of jk) {
    const num = jointVal(joints[k]);
    const pct = Math.max(0, Math.min(100, (num + 3.14) / 6.28 * 100));
    const lbl = document.getElementById("jv-" + cssId(k));
    const bar = document.getElementById("jb-" + cssId(k));
    if (lbl) lbl.textContent = num.toFixed(3);
    if (bar) bar.style.width = pct + "%";
  }
}

function cssId(s) { return s.replace(/[^a-zA-Z0-9_-]/g, "_"); }

function renderCameras() {
  const wrap = document.getElementById("cams");
  if (!wrap || !selected) return;
  const cams = cameras[selected] || {};
  const names = Object.keys(cams);
  if (!names.length) { wrap.innerHTML = ""; wrap.dataset.keys = ""; return; }
  // Build <img> elements once; thereafter only swap the src so the browser
  // does not tear down/rebuild the decode pipeline at 10Hz.
  if (wrap.dataset.keys !== names.join(",")) {
    wrap.dataset.keys = names.join(",");
    let h = `<h2 style="margin-top:14px">Cameras</h2><div class="camgrid">`;
    for (const n of names) {
      h += `<div class="cam"><img id="cam-${cssId(n)}" alt="${n}"/><div class="caml">${n}</div></div>`;
    }
    h += `</div>`;
    wrap.innerHTML = h;
  }
  for (const n of names) {
    const c = cams[n];
    const img = document.getElementById("cam-" + cssId(n));
    if (img && c.encoding === "jpeg") img.src = `data:image/jpeg;base64,${c.data}`;
  }
}

function rpc(obj) {
  if (!ws || ws.readyState !== 1) { addEvent("err", "ws not connected", "err"); return; }
  obj.req_id = ++reqSeq;
  ws.send(JSON.stringify(obj));
}
function tellPeer() {
  const inp = document.getElementById("cmdInput"); const instr = inp.value.trim();
  if (!instr || !selected) return;
  rpc({ action: "send", target: selected, cmd: { action: "execute", instruction: instr, policy_provider: "mock" } });
  addEvent("cmd", `tell ${selected}: ${instr}`, "cmd"); inp.value = "";
}
function sendAction(a) {
  if (!selected) return;
  rpc({ action: "send", target: selected, cmd: { action: a } });
  addEvent("cmd", `${a} -> ${selected}`, "cmd");
}
function estop() {
  rpc({ action: "emergency_stop" });
  addEvent("cmd", "EMERGENCY STOP broadcast", "err");
}

// -- Teleop client ---------------------------------------------------
let teleop = { active: false, target: null, device: "dashboard", joints: {}, timer: null };

function teleopToggle() {
  if (teleop.active) { teleopStop(); return; }
  if (!selected) return;
  teleop.target = selected;
  // Seed joint targets from the latest known state.
  const s = states[selected] || {};
  teleop.joints = {};
  for (const [k, v] of Object.entries(s.joints || {})) teleop.joints[k] = jointVal(v);
  rpc({ action: "teleop_start", target: selected, device: teleop.device });
  teleop.active = true;
  buildTeleopUI();
  // Stream frames at ~20Hz.
  teleop.timer = setInterval(sendTeleopFrame, 50);
  const btn = document.getElementById("teleopBtn");
  if (btn) { btn.textContent = "disable"; btn.classList.add("on"); }
  document.getElementById("teleopHint").textContent = "WASD/QE-RF... per joint · keys grab focus";
  window.addEventListener("keydown", teleopKey);
  addEvent("cmd", `teleop START -> ${selected}`, "cmd");
}

function teleopStop() {
  if (!teleop.active) return;
  if (teleop.timer) clearInterval(teleop.timer);
  teleop.timer = null;
  window.removeEventListener("keydown", teleopKey);
  if (teleop.target) rpc({ action: "teleop_stop", target: teleop.target, device: teleop.device });
  addEvent("cmd", `teleop STOP -> ${teleop.target}`, "cmd");
  teleop.active = false; teleop.target = null;
  const btn = document.getElementById("teleopBtn");
  if (btn) { btn.textContent = "enable"; btn.classList.remove("on"); }
  const hint = document.getElementById("teleopHint"); if (hint) hint.textContent = "";
  const tj = document.getElementById("teleopJoints"); if (tj) tj.innerHTML = "";
}

function sendTeleopFrame() {
  if (!teleop.active || !teleop.target) return;
  rpc({ action: "teleop_frame", target: teleop.target, device: teleop.device, frame: teleop.joints });
}

function buildTeleopUI() {
  const wrap = document.getElementById("teleopJoints");
  if (!wrap) return;
  const keys = Object.keys(teleop.joints);
  if (!keys.length) { wrap.innerHTML = '<div class="empty">No joints to drive.</div>'; return; }
  // Map first 6 joints to keyboard pairs.
  const pairs = [["w","s"],["e","d"],["r","f"],["u","j"],["i","k"],["o","l"]];
  let h = "";
  keys.forEach((k, idx) => {
    const pair = pairs[idx] || ["",""];
    h += `<div class="tj">
      <div class="tjl"><span>${k}</span>
        <span class="tjk">${pair[0]}/${pair[1]}</span>
        <span id="tjv-${cssId(k)}">${teleop.joints[k].toFixed(2)}</span></div>
      <input type="range" min="-3.14" max="3.14" step="0.01" value="${teleop.joints[k]}"
        id="tjs-${cssId(k)}" oninput="teleopSlider('${k}', this.value)"/>
    </div>`;
  });
  wrap.innerHTML = h;
}

function teleopSlider(k, v) {
  teleop.joints[k] = parseFloat(v);
  const lbl = document.getElementById("tjv-" + cssId(k));
  if (lbl) lbl.textContent = parseFloat(v).toFixed(2);
}

function teleopKey(e) {
  if (!teleop.active) return;
  const keys = Object.keys(teleop.joints);
  const map = {w:[0,+1],s:[0,-1],e:[1,+1],d:[1,-1],r:[2,+1],f:[2,-1],
               u:[3,+1],j:[3,-1],i:[4,+1],k:[4,-1],o:[5,+1],l:[5,-1]};
  const m = map[e.key.toLowerCase()];
  if (!m) return;
  const [idx, dir] = m;
  if (idx >= keys.length) return;
  e.preventDefault();
  const k = keys[idx];
  teleop.joints[k] = Math.max(-3.14, Math.min(3.14, teleop.joints[k] + dir * 0.05));
  const sl = document.getElementById("tjs-" + cssId(k)); if (sl) sl.value = teleop.joints[k];
  const lbl = document.getElementById("tjv-" + cssId(k)); if (lbl) lbl.textContent = teleop.joints[k].toFixed(2);
}

function addEvent(kind, text, cls) {
  const el = document.getElementById("events");
  const t = new Date().toLocaleTimeString();
  const div = document.createElement("div");
  div.className = "event " + (cls || (kind.includes("join") ? "peer_join" : ""));
  div.innerHTML = `<span class="t">${t}</span> <b>${kind}</b> ${text}`;
  el.insertBefore(div, el.firstChild);
  while (el.children.length > 200) el.removeChild(el.lastChild);
}

// Inline onclick= handlers run in global scope, but this is a module.
// Bridge the functions the HTML references onto window.
Object.assign(window, {
  select, estop, tellPeer, sendAction, teleopToggle, teleopSlider,
});

connect();
setInterval(renderPeers, 1000); // refresh ages
</script>
</body>
</html>

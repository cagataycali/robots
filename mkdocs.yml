site_name: Strands Robots
site_url: https://strands-labs.github.io/robots/
site_description: One Robot object, any robot, in simulation or on real hardware, driven by an agent.
repo_url: https://github.com/strands-labs/robots
repo_name: strands-labs/robots
edit_uri: edit/main/docs/
strict: true
docs_dir: docs
exclude_docs: |
  hooks/

theme:
  name: material
  custom_dir: overrides
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  logo: assets/img/mark.svg
  favicon: assets/img/mark.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: paper
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Paper
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.suggest
    - search.highlight
    - toc.follow

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - path: assets/viewer/robot-viewer.js
    type: module

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/strands-labs/robots
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/strands-robots/

hooks:
  - docs/hooks/numbers.py
  - docs/hooks/manifest.py


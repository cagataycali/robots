- Agents & Dashboard:
  - AI Agents: agents.md
  - Dashboard: dashboard.md
  - Multi-robot Mesh: mesh.md
  - Tool Result Contract: contracts.md
- Data & Training:
  - Recording: recording.md
  - DatasetRecorder API: data/dataset-recorder.md
